<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gullakh – Notifications</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/dashboard.css?v=3">
<style>
.notif-list{display:flex;flex-direction:column;gap:8px}
.notif-item{display:flex;align-items:flex-start;gap:14px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);transition:var(--transition);cursor:pointer;position:relative}
.notif-item:hover{border-color:var(--border-hover);background:var(--surface-hover)}
.notif-item.unread{border-left:3px solid var(--clay);background:rgba(201,123,54,.04)}
.notif-item.unread::after{content:'';position:absolute;top:16px;right:16px;width:8px;height:8px;border-radius:50%;background:var(--clay);animation:pulse 2s infinite}
.notif-icon-wrap{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.notif-body{flex:1}
.notif-title{font-size:.88rem;font-weight:600;color:var(--text);margin-bottom:3px}
.notif-msg{font-size:.78rem;color:var(--text-muted);line-height:1.5}
.notif-time{font-size:.68rem;color:var(--text-dim);margin-top:5px;display:block}
.notif-actions{display:flex;gap:6px;margin-top:8px}
.notif-action-btn{font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--text-muted);cursor:pointer;font-family:var(--font);transition:var(--transition)}
.notif-action-btn:hover{border-color:var(--clay);color:var(--clay)}
.notif-action-btn.primary{background:rgba(201,123,54,.15);color:var(--clay);border-color:rgba(201,123,54,.3)}
.notif-header-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.notif-count-badge{background:var(--clay);color:#fff;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px}
</style>
</head>
<body>
<div class="amb amb-gold"></div><div class="amb amb-clay"></div><div class="grain"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo"><span class="logo-dot">🪙</span><span class="logo-text">Gullakh</span></div>
  <nav class="sidebar-nav">
    <a href="dashboard.html" class="nav-item"><span class="nav-icon">⊞</span><span class="nav-label">Dashboard</span></a>
    <a href="transactions.html" class="nav-item"><span class="nav-icon">↕</span><span class="nav-label">Transactions</span></a>
    <a href="analysis.html" class="nav-item"><span class="nav-icon">◈</span><span class="nav-label">Analysis</span></a>
    <a href="goals.html" class="nav-item"><span class="nav-icon">◎</span><span class="nav-label">Goals</span></a>
    <a href="insights.html" class="nav-item"><span class="nav-icon">✦</span><span class="nav-label">Insights</span></a>
    <a href="ai-assistant.html" class="nav-item"><span class="nav-icon">◉</span><span class="nav-label">AI Assistant</span></a>
    <a href="categories.html" class="nav-item"><span class="nav-icon">⊛</span><span class="nav-label">Expense Categories</span></a>
    <a href="notifications.html" class="nav-item active"><span class="nav-icon">◐</span><span class="nav-label">Notifications</span><span class="nav-badge">3</span></a>
    <a href="settings.html" class="nav-item"><span class="nav-icon">⚙</span><span class="nav-label">Settings</span></a>
    <a href="index.html" class="nav-item" style="color: #f87171; margin-top: auto;" onclick="localStorage.clear()"><span class="nav-icon">🚪</span><span class="nav-label">Logout</span></a>
  </nav>
  <div class="sidebar-footer"><div class="user-mini"><div class="user-avatar-sm">A</div><div class="user-info-sm"><span class="user-name-sm">Arjun Sharma</span><span class="user-role-sm">Student</span></div></div></div>
</aside>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="main-wrapper">
  <header class="topbar">
    <div class="topbar-left"><button class="hamburger" id="hamburger">&#9776;</button><div class="topbar-greeting"><span class="greeting-text">Good Morning, <strong class="greeting-user-name>User</strong> 👋</span><span class="greeting-quote">Track Smart. Save Smarter.</span></div></div>
    <div class="topbar-right"><div class="search-bar"><span class="search-icon">🔍</span><input type="text" placeholder="Search..."></div><a href="notifications.html" class="icon-btn notif-btn"><span>🔔</span><span class="notif-dot"></span></a><div class="user-avatar">A</div></div>
  </header>
  <main class="page-content">
    <div class="page-header"><h2 class="page-title">Notifications</h2><span class="page-subtitle">Stay updated on your financial activity</span></div>

    <div class="notif-header-bar animate-in">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="tabs" style="margin-bottom:0">
          <button class="tab-btn active" onclick="filterNotifs('all',this)">All</button>
          <button class="tab-btn" onclick="filterNotifs('unread',this)">Unread <span class="notif-count-badge" id="unread-count">3</span></button>
          <button class="tab-btn" onclick="filterNotifs('alerts',this)">Alerts</button>
          <button class="tab-btn" onclick="filterNotifs('ai',this)">AI Insights</button>
        </div>
      </div>
      <button class="btn-ghost" onclick="markAllRead()">Mark all as read</button>
    </div>

    <div class="notif-list animate-in" style="animation-delay:.1s" id="notif-list">
      <!-- Rendered by JS -->
    </div>
  </main>
</div>
<script src="../js/dashboard.js"></script>
<script>
const notifications = [
  {id:1,type:'alert',unread:true,icon:'⚠️',iconBg:'rgba(248,113,113,.15)',title:'Food Budget Exceeded!',msg:'You\'ve spent ₹3,760 on food this month, exceeding your ₹3,500 limit by ₹260. Consider reducing food delivery orders.',time:'2 hours ago',actions:[{label:'View Budget',primary:true,link:'dashboard.html'},{label:'Dismiss',primary:false}]},
  {id:2,type:'ai',unread:true,icon:'🤖',iconBg:'rgba(201,123,54,.15)',title:'AI Found Unnecessary Expenses',msg:'Gullakh AI detected 3 overlapping subscriptions costing ₹1,067/month. Consolidating could save ₹500/month.',time:'5 hours ago',actions:[{label:'View Insights',primary:true,link:'insights.html'},{label:'Dismiss',primary:false}]},
  {id:3,type:'goal',unread:true,icon:'🎯',iconBg:'rgba(52,211,153,.15)',title:'Goal Progress Updated',msg:'Your Laptop Purchase goal is now at 78%! Just ₹4,400 more to go. You\'re on track to complete it by December 31.',time:'1 day ago',actions:[{label:'View Goal',primary:true,link:'goals.html'},{label:'Add Funds',primary:false}]},
  {id:4,type:'ai',unread:false,icon:'✦',iconBg:'rgba(244,185,66,.15)',title:'Monthly Savings Improved',msg:'Great news! Your savings rate improved from 18.2% to 23.9% this month. You\'re now above the recommended 20% benchmark.',time:'1 day ago',actions:[{label:'View Analysis',primary:true,link:'analysis.html'}]},
  {id:5,type:'alert',unread:false,icon:'🛒',iconBg:'rgba(244,185,66,.15)',title:'Shopping Budget Alert',msg:'Your shopping spend (₹3,999) has exceeded your monthly budget of ₹3,000. This is 133% of your limit.',time:'2 days ago',actions:[{label:'View Categories',primary:true,link:'categories.html'},{label:'Dismiss',primary:false}]},
  {id:6,type:'goal',unread:false,icon:'💰',iconBg:'rgba(52,211,153,.15)',title:'Savings Milestone Reached',msg:'Congratulations! You\'ve saved ₹32,500 in total across all your goals. Keep up the excellent work!',time:'3 days ago',actions:[{label:'View Goals',primary:true,link:'goals.html'}]},
  {id:7,type:'ai',unread:false,icon:'💡',iconBg:'rgba(167,139,250,.15)',title:'Weekend Spending Pattern Detected',msg:'You spend 2.4x more on food delivery on weekends. Cooking at home on weekends could save ₹1,500/month.',time:'4 days ago',actions:[{label:'View Insights',primary:true,link:'insights.html'}]},
  {id:8,type:'alert',unread:false,icon:'🔔',iconBg:'rgba(56,189,248,.15)',title:'New Transaction Recorded',msg:'A transaction of ₹1,299 was recorded for Amazon. Category: Shopping.',time:'5 days ago',actions:[{label:'View Transactions',primary:true,link:'transactions.html'}]},
];

let currentFilter = 'all';

function renderNotifs(list) {
  const container = document.getElementById('notif-list');
  if (!list.length) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">🔔</div><p class="empty-title">No notifications</p><p class="empty-sub">You\'re all caught up! Check back later for updates.</p></div>';
    return;
  }
  container.innerHTML = list.map(n => `
    <div class="notif-item ${n.unread?'unread':''}" id="notif-${n.id}">
      <div class="notif-icon-wrap" style="background:${n.iconBg}">${n.icon}</div>
      <div class="notif-body">
        <div class="notif-title">${n.title}</div>
        <div class="notif-msg">${n.msg}</div>
        <span class="notif-time">${n.time}</span>
        <div class="notif-actions">
          ${n.actions.map(a => `<button class="notif-action-btn ${a.primary?'primary':''}" onclick="${a.link?`window.location='${a.link}'`:`markRead(${n.id})`}">${a.label}</button>`).join('')}
        </div>
      </div>
    </div>`).join('');
}

function filterNotifs(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  let list = notifications;
  if (type === 'unread') list = notifications.filter(n => n.unread);
  else if (type === 'alerts') list = notifications.filter(n => n.type === 'alert');
  else if (type === 'ai') list = notifications.filter(n => n.type === 'ai');
  renderNotifs(list);
}

function markRead(id) {
  const n = notifications.find(n => n.id === id);
  if (n) n.unread = false;
  updateUnreadCount();
  filterNotifs(currentFilter, document.querySelector('.tab-btn.active'));
}

function markAllRead() {
  notifications.forEach(n => n.unread = false);
  updateUnreadCount();
  filterNotifs(currentFilter, document.querySelector('.tab-btn.active'));
  showToast('All Read', 'All notifications marked as read', 'success');
}

function updateUnreadCount() {
  const count = notifications.filter(n => n.unread).length;
  document.getElementById('unread-count').textContent = count;
}

renderNotifs(notifications);
</script>
</body>
</html>
